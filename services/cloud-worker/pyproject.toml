[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-cloud-worker"
version = "0.1.0"
description = "Wind-assisted regional cloud tracking for Drift"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.2.6", "opencv-python-headless==4.12.0.88",
  "pyproj==3.7.2", "shapely==2.1.2", "xarray==2025.10.1",
  "netCDF4==1.7.5.1.post1", "jsonschema==4.25.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
drift-cloud-worker = "cloud_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloud_worker*"]

[tool.setuptools.package-data]
cloud_worker = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
