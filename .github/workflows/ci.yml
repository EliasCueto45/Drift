name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      TRACKING_INGEST_SECRET: ci-only-secret
      DRIFT_TEST_BACKEND: "1"
      DRIFT_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e . -e services/cloud-worker
      - name: Disposable MongoDB replica set
        run: |
          docker run -d --name drift-test-mongo -p 27017:27017 mongo:8.2 --replSet drift-test --bind_ip_all
          python -m drift_tools.init_mongo
      - run: python -m drift_tools.cli check-contracts
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -W error -m pytest
      - run: python -W error -m pytest services/cloud-worker/tests
      - name: Verify fixture generation is reproducible
        run: |
          python -m drift_tools.cli fixtures-gen
          git diff --exit-code -- fixtures
      - if: always()
        run: docker rm -f drift-test-mongo
