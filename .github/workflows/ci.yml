name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    env:
      TRACKING_INGEST_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Generated types + fixtures must be committed and in sync with the schema.
      - run: pnpm check:contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Tests the smoke tooling itself against the fixture-backed mock API.
      # Replace with the real stack (web + db) once Owner 2's API exists.
      - name: smoke (mock API)
        run: |
          PORT=3000 node tools/mock-api.mjs &
          sleep 2
          pnpm smoke
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Worker integration tests invoke the shared Node mock and smoke suite.
      # Jobs use separate runners; the node job's installation is not available here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: packages/contracts/python/requirements.txt }
      - run: pip install -r packages/contracts/python/requirements.txt
      - run: |
          if [ -f services/cloud-worker/requirements.txt ]; then pip install -r services/cloud-worker/requirements.txt; fi
      # Both languages must accept the same fixtures and agree on wind math.
      - run: python -m pytest packages/contracts/python -q
      - run: |
          if [ -d services/cloud-worker/tests ]; then python -m pytest services/cloud-worker/tests -q; fi
