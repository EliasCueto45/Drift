# Atlas users only need storage. Local MongoDB is optional:
# docker compose up -d db; python -m drift_tools.init_mongo
services:
  db:
    image: mongo:8.2
    command: ["mongod", "--replSet", "drift-test", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongodata:/data/db]
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drift
      MINIO_ROOT_PASSWORD: driftdriftdrift
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
volumes:
  mongodata:
  miniodata:
